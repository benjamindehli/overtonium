name: Install the Linux build dependencies
description: >
  The headers JUCE needs to build the plugin on Linux, with short apt
  timeouts and retries, and any extra packages a job asks for.

inputs:
  extra-packages:
    description: Packages this job needs beyond the build, space separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The hosted runners reach apt through an Azure mirror that intermittently
    # stops answering. Apt's own default is to wait on it for a very long time
    # and then fall back, which turns a mirror having a bad afternoon into a
    # job that sits for hours instead of failing. Short timeouts and a few
    # retries make it either work or give up quickly enough to re-run.
    - name: Install
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        sudo tee /etc/apt/apt.conf.d/99-overtonium-timeouts >/dev/null <<'CONF'
        Acquire::Retries "3";
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        CONF

        for attempt in 1 2 3; do
          if sudo apt-get update; then
            break
          fi

          echo "apt-get update failed on attempt $attempt, retrying"
          sleep 10
        done

        # Split on spaces on purpose, one package a word.
        # shellcheck disable=SC2086
        sudo apt-get install --no-install-recommends -y \
          libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
          libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
          libxcomposite-dev libgl-dev libcurl4-openssl-dev \
          libxi-dev libegl-dev $EXTRA_PACKAGES

name: Release

# Cutting a tag builds the plugin on all three platforms and attaches the
# results to a GitHub release. Runnable by hand as well, which builds and
# uploads the archives as run artefacts without publishing anything, so the
# packaging can be exercised without spending a version number on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Building needs to read the repository and nothing else. Publishing needs to
# write, and only the one job that publishes is given that.
permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The archive is named from the tag, but the version a host displays
      # comes from CMakeLists. Left unchecked, tagging v1.0.0 against a
      # project still saying 0.1.0 ships a file whose name and contents
      # disagree, and nobody notices until someone reads the plugin's version
      # in a host.
      - name: The tag has to match the project version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          project=$(sed -n 's/^project(Overtonium VERSION \([0-9.]*\).*/\1/p' \
                    CMakeLists.txt)
          tagged="${GITHUB_REF_NAME#v}"

          echo "CMakeLists says $project, the tag says $tagged"

          if [ "$project" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $project"
            exit 1
          fi

      # Same treatment as the build workflow: the hosted runners reach apt
      # through a mirror that intermittently stops answering, and apt's own
      # defaults wait on it far longer than anyone wants to watch.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo tee /etc/apt/apt.conf.d/99-overtonium-timeouts >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          CONF

          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi

            echo "apt-get update failed on attempt $attempt, retrying"
            sleep 10
          done

          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libgl-dev

      # No architecture override here, unlike the build workflow. That one
      # builds for the runner's own architecture to keep every push quick.
      # A release is the case the universal binary exists for, so the default
      # from CMakeLists applies and macOS gets arm64 and x86_64 in one bundle.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DOVERTONIUM_INSTALL_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      # A release is exactly when it is worth knowing the tests still pass,
      # even though the same commit has usually been through them already.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Signing, with or without a certificate.
      #
      # With one, the bundles get a Developer ID Application signature and the
      # hardened runtime, which is what notarisation later requires. Without
      # one they get an ad-hoc signature, which notarises nothing but is still
      # what lets them load at all on Apple Silicon, where an unsigned bundle
      # is refused outright. The workflow has to work either way so that it can
      # be rehearsed before the secrets exist.
      #
      # No --deep, which Apple discourages and which nothing here needs: JUCE
      # is linked statically, so none of these bundles carry nested code.
      - name: Sign the macOS bundles
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          identity=""
          installer_identity=""

          if [ -n "$CERT_P12" ]; then
            keychain="$RUNNER_TEMP/overtonium.keychain-db"
            password="$(uuidgen)"

            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"

            echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
            security import "$RUNNER_TEMP/app.p12" -k "$keychain" \
              -P "$CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/app.p12"

            if [ -n "$INSTALLER_P12" ]; then
              echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/inst.p12"
              security import "$RUNNER_TEMP/inst.p12" -k "$keychain" \
                -P "$INSTALLER_PASSWORD" -T /usr/bin/productbuild
              rm -f "$RUNNER_TEMP/inst.p12"
            fi

            security set-key-partition-list -S apple-tool:,apple: \
              -k "$password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" login.keychain-db

            identity=$(security find-identity -v -p codesigning "$keychain" \
                       | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' \
                       | head -1)
            installer_identity=$(security find-identity -v "$keychain" \
                       | sed -n 's/.*"\(Developer ID Installer[^"]*\)".*/\1/p' \
                       | head -1)

            echo "signing as: ${identity:-none found}"
            echo "installer:  ${installer_identity:-none found}"
          fi

          for bundle in build/Overtonium_artefacts/Release/*/Overtonium.*; do
            [ -e "$bundle" ] || continue

            entitlements="build/Overtonium_artefacts/JuceLibraryCode/$(basename "$(dirname "$bundle")")"
            args=(--force --timestamp)

            if [ -n "$identity" ]; then
              # The hardened runtime is not optional: notarisation refuses
              # anything without it.
              args+=(--options runtime --sign "$identity")
            else
              args+=(--sign -)
            fi

            codesign "${args[@]}" "$bundle"
            codesign --verify --strict "$bundle"
            echo "signed $bundle"
          done

          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "installer_identity=$installer_identity" >> "$GITHUB_OUTPUT"

      # Through the environment rather than interpolated into the script.
      # These are all values we control, but a workflow expression pasted into
      # a shell is the shape that goes wrong later, and it means the script can
      # be run and tested on its own.
      - name: Work out what to call it
        id: naming
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-$(echo "$GITHUB_SHA" | cut -c1-8)"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=Overtonium-$version-$PLATFORM" >> "$GITHUB_OUTPUT"

      # Everything the build produced except the static library it links from,
      # which is of no use to anyone installing this.
      #
      # Staged into a directory named after the archive so that all three
      # platforms unzip to one folder with that name, rather than scattering
      # their contents into whatever directory the archive was opened in.
      - name: Stage
        shell: bash
        env:
          ARCHIVE: ${{ steps.naming.outputs.archive }}
        run: |
          mkdir -p "$ARCHIVE"

          for format in VST3 AU LV2 Standalone; do
            dir="build/Overtonium_artefacts/Release/$format"
            [ -d "$dir" ] || continue

            mkdir -p "$ARCHIVE/$format"
            cp -R "$dir"/* "$ARCHIVE/$format/"
            echo "staged $format"
          done

          cp README.md LICENSE "$ARCHIVE/"
          ls -R "$ARCHIVE"

      # ditto on macOS rather than zip, because a plugin is a bundle and ditto
      # is the tool that puts one in an archive without losing anything.
      - name: Archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ steps.naming.outputs.archive }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE" "$ARCHIVE.zip"
          else
            zip -r -y "$ARCHIVE.zip" "$ARCHIVE"
          fi

      # Windows gets its own step because the bash on those runners is the one
      # that comes with Git, and that does not carry zip.
      - name: Archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.naming.outputs.archive }}
        run: |
          Compress-Archive -Path $env:ARCHIVE -DestinationPath "$env:ARCHIVE.zip"

      # ---- installers -------------------------------------------------------
      #
      # The archive above stays, because it is what somebody without
      # administrator rights, or with plugin folders somewhere of their own,
      # actually needs. The installer is what everyone else wants.

      - name: Build the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.naming.outputs.version }}
          INSTALLER_IDENTITY: ${{ steps.macsign.outputs.installer_identity }}
        run: |
          packaging/macos/build-pkg.sh "${VERSION#v}" \
            build/Overtonium_artefacts/Release \
            "Overtonium-$VERSION-macOS.pkg" \
            "$INSTALLER_IDENTITY"

      # Notarisation is what stops Gatekeeper refusing the installer on a
      # machine that has never seen it. It only runs when there is an account
      # to submit with, so a rehearsal without the secrets still produces a
      # package, just one that has to be opened past a warning.
      #
      # Stapling matters as much as the submission: it writes the ticket into
      # the package so the machine opening it does not have to ask Apple, which
      # is the difference between working offline and not.
      - name: Notarise the macOS installer
        if: runner.os == 'macOS' && steps.macsign.outputs.installer_identity != ''
        shell: bash
        env:
          VERSION: ${{ steps.naming.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
            echo "::warning::signed but not notarised, no Apple ID secrets set"
            exit 0
          fi

          xcrun notarytool submit "Overtonium-$VERSION-macOS.pkg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "Overtonium-$VERSION-macOS.pkg"
          xcrun stapler validate "Overtonium-$VERSION-macOS.pkg"

          # What a machine downloading it will actually decide.
          spctl --assess --type install -vv "Overtonium-$VERSION-macOS.pkg"

      # Inno Setup is on the Windows runners already. Installing it through a
      # package manager on every release would be one more thing to go down.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.naming.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not on the image, installing it"
            choco install innosetup --no-progress -y
          }

          $version = $env:VERSION -replace '^v', ''
          $artefacts = "$PWD\build\Overtonium_artefacts\Release"

          & $iscc "/DVersion=$version" "/DArtefacts=$artefacts" `
            "/FOvertonium-$env:VERSION-Windows" `
            "/Opackaging\windows\out" `
            "packaging\windows\overtonium.iss"

          Move-Item "packaging\windows\out\Overtonium-$env:VERSION-Windows.exe" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.naming.outputs.archive }}
          path: |
            ${{ steps.naming.outputs.archive }}.zip
            Overtonium-${{ steps.naming.outputs.version }}-macOS.pkg
            Overtonium-${{ steps.naming.outputs.version }}-Windows.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only on a tag. A run started by hand leaves its archives attached to the
    # run and publishes nothing, which is the point of being able to start one.
    if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l archives

          cat > notes.md <<'NOTES'
          ## Installing

          Take the installer for your platform. The zip beside it holds the
          same builds loose, for anyone without administrator rights or with
          plugin folders of their own.

          | Platform | Installer | Formats |
          |---|---|---|
          | macOS | `.pkg`, with a chooser | VST3, Audio Unit, Standalone |
          | Windows | `.exe` | VST3, Standalone |
          | Linux | none, use the zip | VST3, LV2, Standalone |

          The macOS build is a universal binary and runs on both Apple Silicon
          and Intel. Logic and GarageBand only rescan Audio Units after a
          restart.

          On Linux the zip's contents go in `~/.vst3` and `~/.lv2`.

          ### Windows will warn you

          The Windows installer is not signed, so SmartScreen will say the
          publisher is unknown. Choose "More info" and then "Run anyway". If
          you would rather not, build from source: the readme says how, and it
          takes one CMake command.

          ### macOS

          The installer is signed and notarised, so it should open without a
          warning. If it does not, the release was built before the signing
          certificates were in place, and right-clicking it and choosing Open
          gets past Gatekeeper.
          NOTES

          gh release create "$GITHUB_REF_NAME" \
            --title "Overtonium $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            archives/*

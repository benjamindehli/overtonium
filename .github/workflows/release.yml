name: Release

# Cutting a tag builds the plugin on all three platforms and attaches the
# results to a GitHub release. Runnable by hand as well, which builds and
# uploads the archives as run artefacts without publishing anything, so the
# packaging can be exercised without spending a version number on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Building needs to read the repository and nothing else. Publishing needs to
# write, and only the one job that publishes is given that.
permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Three places name the version and all three have to agree. The archive
      # is named from the tag, the version a host displays comes from
      # CMakeLists, and the notes on the release page come from the file in
      # release-notes/ named after the tag. Tagging v2.0.0 against a project
      # still saying 1.0.0 ships a file whose name and contents disagree, and a
      # tag with no notes beside it would publish a release page with nothing
      # on it. Neither shows up anywhere the person cutting the release is
      # looking.
      #
      # Everything is reported before giving up, so a release that got two of
      # them wrong takes one round trip rather than two.
      - name: The tag has to match the project version and the notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          notes="release-notes/$tagged.md"
          status=0

          project=$(sed -n 's/^project(Overtonium VERSION \([0-9.]*\).*/\1/p' \
                    CMakeLists.txt)

          echo "CMakeLists says ${project:-nothing}, the tag says $tagged"

          if [ "$project" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $project"
            status=1
          fi

          # One file per release, so the notes for a version cannot be
          # overwritten by the next one and the tag picks its own out by name.
          if [ ! -f "$notes" ]; then
            echo "::error::$notes does not exist"
            echo "release-notes/ holds:"
            ls release-notes/ || true
            status=1
          else
            # The first heading in the file rather than the first one that
            # happens to match, so a version named further down cannot stand in
            # for the title itself being right. The filename alone is not
            # enough: copying last release's notes to a new name is exactly the
            # mistake this catches.
            headed=$(grep -m1 '^# ' "$notes" \
                     | sed -n 's/^# Overtonium \([0-9][0-9.]*\) *$/\1/p')

            echo "$notes is headed ${headed:-nothing recognisable}"

            if [ -z "$headed" ]; then
              echo "::error::$notes needs to start with '# Overtonium $tagged'"
              status=1
            elif [ "$headed" != "$tagged" ]; then
              echo "::error::$notes is headed $headed but the tag says $tagged"
              status=1
            fi
          fi

          exit $status

      # Same treatment as the build workflow: the hosted runners reach apt
      # through a mirror that intermittently stops answering, and apt's own
      # defaults wait on it far longer than anyone wants to watch.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo tee /etc/apt/apt.conf.d/99-overtonium-timeouts >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          CONF

          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi

            echo "apt-get update failed on attempt $attempt, retrying"
            sleep 10
          done

          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libgl-dev libcurl4-openssl-dev

      # No architecture override here, unlike the build workflow. That one
      # builds for the runner's own architecture to keep every push quick.
      # A release is the case the universal binary exists for, so the default
      # from CMakeLists applies and macOS gets arm64 and x86_64 in one bundle.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DOVERTONIUM_INSTALL_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel 2

      # Checked rather than trusted, because every way this can go wrong is
      # silent on the build machine. The runners are Apple Silicon, so an
      # arm64-only build tests clean, signs, notarises and installs, and the
      # first thing to report a problem is an Intel Mac refusing to open it.
      #
      # The minimum macOS each slice carries is printed alongside, since it is
      # set from the same two variables and is lost the same quiet way. Expect
      # 10.13 for x86_64 and 11.0 for arm64, which is the floor the toolchain
      # raises that slice to and cannot go below.
      - name: Check the macOS binaries are universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          status=0
          found=0

          while IFS= read -r binary; do
            file -b "$binary" | grep -q Mach-O || continue

            found=$((found + 1))
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"

            for want in arm64 x86_64; do
              case " $archs " in
                *" $want "*)
                  echo "  $want minos $(otool -l -arch "$want" "$binary" \
                    | awk '/minos/ { print $2; exit }')"
                  ;;
                *)
                  echo "::error::$binary has no $want slice"
                  status=1
                  ;;
              esac
            done
          done < <(find build/Overtonium_artefacts/Release -type f)

          # A find that matches nothing would otherwise pass this step by
          # checking nothing at all, which is the failure it exists to catch.
          if [ "$found" -eq 0 ]; then
            echo "::error::no Mach-O binaries found to check"
            status=1
          fi

          echo "checked $found binaries"
          exit $status

      # A release is exactly when it is worth knowing the tests still pass,
      # even though the same commit has usually been through them already.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Signing, with or without a certificate.
      #
      # With one, the bundles get a Developer ID Application signature and the
      # hardened runtime, which is what notarisation later requires. Without
      # one they get an ad-hoc signature, which notarises nothing but is still
      # what lets them load at all on Apple Silicon, where an unsigned bundle
      # is refused outright. The workflow has to work either way so that it can
      # be rehearsed before the secrets exist.
      #
      # No --deep, which Apple discourages and which nothing here needs: JUCE
      # is linked statically, so none of these bundles carry nested code.
      - name: Sign the macOS bundles
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          identity=""
          installer_identity=""

          if [ -n "$CERT_P12" ]; then
            keychain="$RUNNER_TEMP/overtonium.keychain-db"
            password="$(uuidgen)"

            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"

            echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
            security import "$RUNNER_TEMP/app.p12" -k "$keychain" \
              -P "$CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/app.p12"

            if [ -n "$INSTALLER_P12" ]; then
              echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/inst.p12"
              security import "$RUNNER_TEMP/inst.p12" -k "$keychain" \
                -P "$INSTALLER_PASSWORD" -T /usr/bin/productbuild
              rm -f "$RUNNER_TEMP/inst.p12"
            fi

            security set-key-partition-list -S apple-tool:,apple: \
              -k "$password" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" login.keychain-db

            identity=$(security find-identity -v -p codesigning "$keychain" \
                       | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' \
                       | head -1)
            installer_identity=$(security find-identity -v "$keychain" \
                       | sed -n 's/.*"\(Developer ID Installer[^"]*\)".*/\1/p' \
                       | head -1)

            echo "signing as: ${identity:-none found}"
            echo "installer:  ${installer_identity:-none found}"
          fi

          for bundle in build/Overtonium_artefacts/Release/*/Overtonium.*; do
            [ -e "$bundle" ] || continue

            entitlements="build/Overtonium_artefacts/JuceLibraryCode/$(basename "$(dirname "$bundle")")"
            args=(--force --timestamp)

            if [ -n "$identity" ]; then
              # The hardened runtime is not optional: notarisation refuses
              # anything without it.
              args+=(--options runtime --sign "$identity")
            else
              args+=(--sign -)
            fi

            codesign "${args[@]}" "$bundle"
            codesign --verify --strict "$bundle"
            echo "signed $bundle"
          done

          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "installer_identity=$installer_identity" >> "$GITHUB_OUTPUT"

      # Through the environment rather than interpolated into the script.
      # These are all values we control, but a workflow expression pasted into
      # a shell is the shape that goes wrong later, and it means the script can
      # be run and tested on its own.
      - name: Work out what to call it
        id: naming
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-$(echo "$GITHUB_SHA" | cut -c1-8)"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=Overtonium-$version-$PLATFORM" >> "$GITHUB_OUTPUT"

      # Everything the build produced except the static library it links from,
      # which is of no use to anyone installing this.
      #
      # Staged into a directory named after the archive so that all three
      # platforms unzip to one folder with that name, rather than scattering
      # their contents into whatever directory the archive was opened in.
      - name: Stage
        shell: bash
        env:
          ARCHIVE: ${{ steps.naming.outputs.archive }}
        run: |
          mkdir -p "$ARCHIVE"

          for format in VST3 AU LV2 Standalone; do
            dir="build/Overtonium_artefacts/Release/$format"
            [ -d "$dir" ] || continue

            mkdir -p "$ARCHIVE/$format"
            cp -R "$dir"/* "$ARCHIVE/$format/"
            echo "staged $format"
          done

          cp README.md LICENSE "$ARCHIVE/"
          ls -R "$ARCHIVE"

      # ditto on macOS rather than zip, because a plugin is a bundle and ditto
      # is the tool that puts one in an archive without losing anything.
      - name: Archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ steps.naming.outputs.archive }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE" "$ARCHIVE.zip"
          else
            zip -r -y "$ARCHIVE.zip" "$ARCHIVE"
          fi

      # Windows gets its own step because the bash on those runners is the one
      # that comes with Git, and that does not carry zip.
      - name: Archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.naming.outputs.archive }}
        run: |
          Compress-Archive -Path $env:ARCHIVE -DestinationPath "$env:ARCHIVE.zip"

      # ---- installers -------------------------------------------------------
      #
      # The archive above stays, because it is what somebody without
      # administrator rights, or with plugin folders somewhere of their own,
      # actually needs. The installer is what everyone else wants.

      - name: Build the macOS installer
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.naming.outputs.version }}
          INSTALLER_IDENTITY: ${{ steps.macsign.outputs.installer_identity }}
        run: |
          packaging/macos/build-pkg.sh "${VERSION#v}" \
            build/Overtonium_artefacts/Release \
            "Overtonium-$VERSION-macOS.pkg" \
            "$INSTALLER_IDENTITY"

      # Notarisation is what stops Gatekeeper refusing the installer on a
      # machine that has never seen it. It only runs when there is an account
      # to submit with, so a rehearsal without the secrets still produces a
      # package, just one that has to be opened past a warning.
      #
      # Stapling matters as much as the submission: it writes the ticket into
      # the package so the machine opening it does not have to ask Apple, which
      # is the difference between working offline and not.
      - name: Notarise the macOS installer
        if: runner.os == 'macOS' && steps.macsign.outputs.installer_identity != ''
        shell: bash
        env:
          VERSION: ${{ steps.naming.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
            echo "::warning::signed but not notarised, no Apple ID secrets set"
            exit 0
          fi

          xcrun notarytool submit "Overtonium-$VERSION-macOS.pkg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "Overtonium-$VERSION-macOS.pkg"
          xcrun stapler validate "Overtonium-$VERSION-macOS.pkg"

          # What a machine downloading it will actually decide.
          spctl --assess --type install -vv "Overtonium-$VERSION-macOS.pkg"

      # Inno Setup is on the Windows runners already. Installing it through a
      # package manager on every release would be one more thing to go down.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.naming.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not on the image, installing it"
            choco install innosetup --no-progress -y
          }

          $version = $env:VERSION -replace '^v', ''
          $artefacts = "$PWD\build\Overtonium_artefacts\Release"

          & $iscc "/DVersion=$version" "/DArtefacts=$artefacts" `
            "/FOvertonium-$env:VERSION-Windows" `
            "/Opackaging\windows\out" `
            "packaging\windows\overtonium.iss"

          Move-Item "packaging\windows\out\Overtonium-$env:VERSION-Windows.exe" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.naming.outputs.archive }}
          path: |
            ${{ steps.naming.outputs.archive }}.zip
            Overtonium-${{ steps.naming.outputs.version }}-macOS.pkg
            Overtonium-${{ steps.naming.outputs.version }}-Windows.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only on a tag. A run started by hand leaves its archives attached to the
    # run and publishes nothing, which is the point of being able to start one.
    if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l archives

          # Idempotent, because the release may already exist. Writing the
          # notes by hand in the web interface creates it, and this job then
          # arrives at a published tag with no release of its own to attach
          # anything to. Uploading to whichever release is there covers that,
          # and covers a re-run after a later step failed, which is the other
          # way this step meets a release it did not create.
          #
          # Creating and uploading are kept apart so hand-written notes are
          # never overwritten by the file. Whoever wrote them meant them.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already published, attaching the archives"
            gh release upload "$GITHUB_REF_NAME" archives/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Overtonium $GITHUB_REF_NAME" \
              --notes-file "release-notes/${GITHUB_REF_NAME#v}.md" \
              --verify-tag \
              archives/*
          fi

      # Two things on the site name this release: docs/latest.json, which the
      # plugin asks whether it is behind, and the five download links on the
      # install page. Publishing and updating them have to be the same act, or
      # every user's check quietly reports the previous version and the
      # download buttons hand out the previous build.
      #
      # main rather than the tag, since the tag is a detached head and the
      # Pages site is served from the branch.
      - name: Point the update feed and the download links at this release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # From the tag, not from the naming step. That step runs in the
          # package job, and a step output does not cross a job boundary, so
          # reading it here yields an empty string and writes a feed naming no
          # version at all.
          version="${GITHUB_REF_NAME#v}"

          if [ -z "$version" ]; then
            echo "::error::no version to write into the feed"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B main origin/main

          cat > docs/latest.json <<JSON
          {
            "version": "$version",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          }
          JSON

          # The install page links each asset by name, and both halves of that
          # name carry the tag:
          #   .../releases/download/<tag>/Overtonium-<tag>-<platform>.<ext>
          page=docs/install/index.html
          pattern='releases/download/v[0-9][0-9.]*/Overtonium-v[0-9][0-9.]*-'

          # Counted before and after, and the job fails if either number is
          # wrong. A substitution that silently matches nothing would leave the
          # page advertising an old release with no sign that anything was
          # missed, which is the one way this can go wrong unnoticed.
          expected=5
          found=$(grep -c -E "$pattern" "$page" || true)

          if [ "$found" -ne "$expected" ]; then
            echo "::error::expected $expected download links in $page, found $found"
            grep -n -E 'releases/download' "$page" || true
            exit 1
          fi

          sed -i -E "s|$pattern|releases/download/$GITHUB_REF_NAME/Overtonium-$GITHUB_REF_NAME-|g" "$page"

          current=$(grep -c "releases/download/$GITHUB_REF_NAME/Overtonium-$GITHUB_REF_NAME-" "$page" || true)

          if [ "$current" -ne "$expected" ]; then
            echo "::error::rewrote $current of $expected download links"
            exit 1
          fi

          echo "the install page points at $GITHUB_REF_NAME"

          if git diff --quiet -- docs/latest.json "$page"; then
            echo "the feed and the links already name $version"
            exit 0
          fi

          git add docs/latest.json "$page"
          git commit -m "Point the update feed and the download links at $GITHUB_REF_NAME"
          git push origin main

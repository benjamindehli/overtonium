name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Once a week, so pluginval gets a seed nobody chose. See the validate step.
  schedule:
    - cron: "17 6 * * 1"

# Every job here does the same two things: read the repository and check it.
# Nothing writes a release, comments on a pull request or touches a package, so
# the token they are handed should not be able to either. Stating it here means
# a job that starts wanting more has to say so.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # A ceiling rather than a target. Nothing here should come near it, and the
    # default is six hours, which is what a step that hangs rather than fails
    # will happily sit through.
    timeout-minutes: 45

    strategy:
      # One platform failing should not hide what the other two would have
      # said, which is usually the thing that tells you which it is.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
            # A universal binary is what a release wants and doubles the time a
            # build takes. The runner's own architecture is enough to compile
            # and test against.
            extra: -DCMAKE_OSX_ARCHITECTURES=arm64
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The hosted runners reach apt through an Azure mirror that intermittently
      # stops answering. Apt's own default is to wait on it for a very long
      # time and then fall back, which turns a mirror having a bad afternoon
      # into a job that sits for hours instead of failing. Short timeouts and a
      # few retries make it either work or give up quickly enough to re-run.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo tee /etc/apt/apt.conf.d/99-overtonium-timeouts >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          CONF

          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi

            echo "apt-get update failed on attempt $attempt, retrying"
            sleep 10
          done

          # xvfb is for pluginval rather than the build. It opens the editor,
          # and the runner has no display for one to open on.
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libgl-dev libcurl4-openssl-dev xvfb

      # Warnings are errors here and nowhere else. JUCE's recommended set is
      # already asked for in CMakeLists and it is a broad one, but a warning
      # that only prints is a warning that survives, and the log is long
      # enough that nobody reads all of it. Someone building from source on a
      # compiler none of these three runners covers still gets a plugin.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DOVERTONIUM_INSTALL_AFTER_BUILD=OFF
          -DOVERTONIUM_WARNINGS_AS_ERRORS=ON
          ${{ matrix.extra }}

      # The job count is given rather than left to the build tool. Without a
      # number, cmake passes a bare -j to make, which means no limit at all,
      # and three targets each pulling in the JUCE modules puts dozens of
      # translation units in flight at once. With link-time optimisation on top
      # that exhausted the memory on the Linux runner, which does not report as
      # a build failure: the runner simply stops answering.
      - name: Build
        run: cmake --build build --config Release --parallel 2

      # Neither suite opens an editor, so both run on a machine with no display.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # pluginval is a host that loads the plugin and misuses it on purpose:
      # silly block sizes, parameters set from the wrong thread, state saved
      # and restored mid-render, buses enabled that nothing asked for. None of
      # that is reachable from our own tests, which drive the processor
      # directly rather than through a plugin format.
      #
      # It runs on all three platforms because that is the point. macOS gets
      # checked by hand before a release, so the value here is Windows and
      # Linux, where nobody loads the plugin into a DAW and a format-level
      # regression would otherwise reach a user first.
      #
      # The VST3 only. The Audio Unit is validated by hand with auval, and
      # loading one from a path rather than an installed location is its own
      # argument with the component registrar that is not worth having here.
      - name: Fetch pluginval
        shell: bash
        env:
          PLUGINVAL_VERSION: v1.0.4
        run: |
          base="https://github.com/Tracktion/pluginval/releases/download"

          case "$RUNNER_OS" in
            macOS)   asset=pluginval_macOS.zip ;;
            Windows) asset=pluginval_Windows.zip ;;
            Linux)   asset=pluginval_Linux.zip ;;
          esac

          # --fail so a wrong tag or a renamed asset fails here. Without it
          # curl writes the 404 page into the zip and the first complaint
          # comes from unzip, about a file that looks like it downloaded.
          curl -sSL --fail --retry 3 -o pluginval.zip \
            "$base/$PLUGINVAL_VERSION/$asset"

          # The bash on the Windows runners is the one Git ships and it has no
          # unzip, the same reason the release workflow archives with pwsh.
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Expand-Archive -Force pluginval.zip ."
          else
            unzip -q -o pluginval.zip
            # The archive does not reliably carry the executable bit through.
            chmod +x pluginval 2>/dev/null || true
            chmod +x pluginval.app/Contents/MacOS/pluginval 2>/dev/null || true
          fi

          # Printed so that a layout that differs from the one expected below
          # reads as a wrong path rather than a mysteriously missing command.
          ls -l

      # The seed is pinned on a push and left to chance on the weekly run.
      #
      # pluginval randomises its parameter values, so an unpinned gate reports
      # a different subset of the space every time: a real defect can pass on
      # Monday and fail on Thursday against code nobody touched, and a failure
      # is awkward to reproduce. That happened here, and the cause was only
      # found by re-running one seed by hand.
      #
      # The pinned value is that seed. It is the one that caught the factory
      # presets being exposed to the VST3, so it is known to reach a part of
      # the space that mattered once, which is a better reason to keep a
      # number than picking a fresh one.
      #
      # Pinning alone would trade a flaky gate for a narrow one, since one seed
      # explores one path. The scheduled run covers the rest: a failure there
      # is information rather than a blocked merge, and its log prints the seed
      # so it can be reproduced exactly.
      - name: Validate the VST3
        shell: bash
        run: |
          vst3=build/Overtonium_artefacts/Release/VST3/Overtonium.vst3

          # Chosen here rather than in a ${{ }} ternary. That idiom returns its
          # third operand whenever the second is falsy, and 0 is the most
          # likely value in the language to be treated that way, which would
          # quietly pin the scheduled run as well and cost exactly the coverage
          # it exists to provide.
          #
          # pluginval reads a seed of 0 as "pick one" (PluginTests.h), and
          # prints whichever it picked either way.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            seed=0
          else
            seed=0x63cc70f
          fi

          echo "random seed: $seed"

          case "$RUNNER_OS" in
            macOS)   run=(./pluginval.app/Contents/MacOS/pluginval) ;;
            Windows) run=(./pluginval.exe) ;;
            # No display on the runner, so pluginval gets a virtual one. -a
            # picks a free server number rather than colliding with a stale
            # lock file from an earlier step.
            Linux)   run=(xvfb-run -a ./pluginval) ;;
          esac

          "${run[@]}" --strictness-level 8 --random-seed "$seed" \
            --validate "$vst3"

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The docs, the readme and the workflows are the parts of this repository
    # that are not C++, so clang-format never sees them. Prettier does, and
    # checking rather than writing means a pull request says so instead of
    # arriving with a reformat mixed into the change it was actually making.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # ci rather than install, so the pinned version in the lockfile is the
      # one that runs. Prettier's output changes between minor versions, and a
      # check that formats differently from the developer's copy is worse than
      # no check.
      - run: npm ci

      - run: npm run format:check

  dsp-core:
    name: DSP core, no build system
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The README claims the DSP core has no JUCE dependency and compiles from a
    # bare compiler. That is worth holding to, so it is checked rather than
    # asserted: no CMake, no JUCE, no third-party headers.
    steps:
      - uses: actions/checkout@v7

      - name: Compile and run
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I Source Tests/dsp_test.cpp Source/dsp/*.cpp -o dsp_test
          ./dsp_test

name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Both jobs do the same two things: read the repository and build it. Nothing
# here writes a release, comments on a pull request or touches a package, so
# the token they are handed should not be able to either. Stating it here means
# a job that starts wanting more has to say so.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # A ceiling rather than a target. Nothing here should come near it, and the
    # default is six hours, which is what a step that hangs rather than fails
    # will happily sit through.
    timeout-minutes: 45

    strategy:
      # One platform failing should not hide what the other two would have
      # said, which is usually the thing that tells you which it is.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
            # A universal binary is what a release wants and doubles the time a
            # build takes. The runner's own architecture is enough to compile
            # and test against.
            extra: -DCMAKE_OSX_ARCHITECTURES=arm64
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      # The hosted runners reach apt through an Azure mirror that intermittently
      # stops answering. Apt's own default is to wait on it for a very long
      # time and then fall back, which turns a mirror having a bad afternoon
      # into a job that sits for hours instead of failing. Short timeouts and a
      # few retries make it either work or give up quickly enough to re-run.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo tee /etc/apt/apt.conf.d/99-overtonium-timeouts >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          CONF

          for attempt in 1 2 3; do
            if sudo apt-get update; then
              break
            fi

            echo "apt-get update failed on attempt $attempt, retrying"
            sleep 10
          done

          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libgl-dev

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DOVERTONIUM_INSTALL_AFTER_BUILD=OFF
          ${{ matrix.extra }}

      # The job count is given rather than left to the build tool. Without a
      # number, cmake passes a bare -j to make, which means no limit at all,
      # and three targets each pulling in the JUCE modules puts dozens of
      # translation units in flight at once. With link-time optimisation on top
      # that exhausted the memory on the Linux runner, which does not report as
      # a build failure: the runner simply stops answering.
      - name: Build
        run: cmake --build build --config Release --parallel 2

      # Neither suite opens an editor, so both run on a machine with no display.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  dsp-core:
    name: DSP core, no build system
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The README claims the DSP core has no JUCE dependency and compiles from a
    # bare compiler. That is worth holding to, so it is checked rather than
    # asserted: no CMake, no JUCE, no third-party headers.
    steps:
      - uses: actions/checkout@v5

      - name: Compile and run
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I Source Tests/dsp_test.cpp Source/dsp/*.cpp -o dsp_test
          ./dsp_test

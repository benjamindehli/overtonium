name: IndexNow

# Tells the search engines that take IndexNow (Bing, and through it the answer
# engines that read Bing's index, and Yandex, Seznam and Naver) which pages
# just changed, so they fetch them again now rather than whenever their crawler
# next comes round.
#
# On a push to main that changes the sitemap, which is every push that changes
# what a page says, since the sitemap carries the day each page last did. Pages
# publishes this site through a workflow GitHub runs itself, which no other
# workflow can follow, so this waits for the published sitemap to match the
# committed one instead, and a crawler sent straight away finds the new page.
#
# The release workflow's own commit to main starts nothing, as no push from a
# workflow does, so it calls this one when it has pushed.
on:
  push:
    branches: [main]
    paths: ["docs/sitemap.xml"]
  workflow_call:
    inputs:
      ref:
        description: The commit whose sitemap to read.
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The key file is the one at the root of benjamindehli.github.io, which
      # another site on the same host already serves. A key at the root of a
      # host covers every address on it, /overtonium/ included. The key is
      # public by design: anyone can read it from that file.
      #
      # Only pages the sitemap dates today or yesterday are sent. The site
      # builder dates a page by the UTC day it ran, so a page edited just
      # before midnight and pushed just after is still sent, and sending a
      # page twice does no harm.
      - name: Send the pages that changed
        env:
          KEY: a842ed43022d4f0db0527dbde835b9ad
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          SITEMAP = "https://benjamindehli.github.io/overtonium/sitemap.xml"

          committed = Path("docs/sitemap.xml").read_text(encoding="utf-8")
          today = datetime.datetime.now(datetime.timezone.utc).date()
          recent = {str(today), str(today - datetime.timedelta(days=1))}

          urls = [loc for loc, day in re.findall(
              r"<loc>([^<]+)</loc>\s*<lastmod>([^<]+)</lastmod>", committed)
              if day in recent]

          if not urls:
              print("no page changed today or yesterday, nothing to send")
              sys.exit(0)

          # Pages usually publishes within a minute or two. Ten minutes is far
          # past that, and after it the pages are sent anyway rather than not
          # at all: a crawler that comes a little early fetches again later.
          for attempt in range(40):
              try:
                  request = urllib.request.Request(
                      f"{SITEMAP}?{time.time()}",
                      headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.read().decode("utf-8") == committed:
                          print("the published sitemap matches this commit")
                          break
              except (urllib.error.URLError, TimeoutError) as e:
                  print(f"  could not read the published sitemap yet: {e}")
              time.sleep(15)
          else:
              print("::warning::the published sitemap never matched this "
                    "commit within ten minutes, sending anyway")

          key = os.environ["KEY"]
          body = json.dumps({
              "host": "benjamindehli.github.io",
              "key": key,
              "keyLocation": f"https://benjamindehli.github.io/{key}.txt",
              "urlList": urls,
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"})

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"IndexNow answered {response.status} for:")
          except urllib.error.HTTPError as e:
              # 403 is a key the file does not match, 422 an address outside
              # the key's host. Both are a setup fault worth failing on.
              print(f"::error::IndexNow answered {e.code}: {e.read().decode(errors='replace')}")
              sys.exit(1)

          for url in urls:
              print(f"  {url}")
          PY

name: IndexNow

# Tells the search engines that take IndexNow (Bing, and through it the answer
# engines that read Bing's index, and Yandex, Seznam and Naver) which pages
# just changed, so they fetch them again now rather than whenever their crawler
# next comes round.
#
# Called by the Pages workflow once it has published the site, after a push
# that changed the sitemap, which is every push that changes what a page says,
# and after a release, about every page. It still waits for the published
# sitemap to match the committed one, since the deployment can report done a
# little before every server has the new pages.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit whose sitemap to read.
        type: string
        required: false
      every_page:
        description: Send every page in the sitemap, not only those changed today or yesterday.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      every_page:
        description: Send every page in the sitemap, not only those changed today or yesterday.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The key file is the one at the root of benjamindehli.github.io, which
      # another site on the same host already serves. A key at the root of a
      # host covers every address on it, /overtonium/ included. The key is
      # public by design: anyone can read it from that file.
      #
      # Only pages the sitemap dates today or yesterday are sent, unless every
      # page is asked for. The site builder dates a page by the UTC day it
      # ran, so a page edited just before midnight and pushed just after is
      # still sent, and sending a page twice does no harm.
      - name: Send the pages that changed
        env:
          KEY: a842ed43022d4f0db0527dbde835b9ad
          EVERY_PAGE: ${{ inputs.every_page || false }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          SITEMAP = "https://benjamindehli.github.io/overtonium/sitemap.xml"

          committed = Path("docs/sitemap.xml").read_text(encoding="utf-8")
          today = datetime.datetime.now(datetime.timezone.utc).date()
          recent = {str(today), str(today - datetime.timedelta(days=1))}

          every_page = os.environ["EVERY_PAGE"] == "true"

          urls = [loc for loc, day in re.findall(
              r"<loc>([^<]+)</loc>\s*<lastmod>([^<]+)</lastmod>", committed)
              if every_page or day in recent]

          if not urls:
              print("no page changed today or yesterday, nothing to send")
              sys.exit(0)

          # The site is usually being served within a minute of the
          # deployment. Ten minutes is far past that, and after it the pages
          # are sent anyway rather than not at all: a crawler that comes a
          # little early fetches again later.
          for attempt in range(40):
              try:
                  request = urllib.request.Request(
                      f"{SITEMAP}?{time.time()}",
                      headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.read().decode("utf-8") == committed:
                          print("the published sitemap matches this commit")
                          break
              except (urllib.error.URLError, TimeoutError) as e:
                  print(f"  could not read the published sitemap yet: {e}")
              time.sleep(15)
          else:
              print("::warning::the published sitemap never matched this "
                    "commit within ten minutes, sending anyway")

          key = os.environ["KEY"]
          body = json.dumps({
              "host": "benjamindehli.github.io",
              "key": key,
              "keyLocation": f"https://benjamindehli.github.io/{key}.txt",
              "urlList": urls,
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"})

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"IndexNow answered {response.status} for:")
          except urllib.error.HTTPError as e:
              # 403 is a key the file does not match, 422 an address outside
              # the key's host. Both are a setup fault worth failing on.
              print(f"::error::IndexNow answered {e.code}: {e.read().decode(errors='replace')}")
              sys.exit(1)

          for url in urls:
              print(f"  {url}")
          PY
